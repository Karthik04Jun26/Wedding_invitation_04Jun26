<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: url('WEDDING_INVITE.jpeg') no-repeat center top;
            background-size: cover;
            color: #333;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
        }
        .countdown {
            font-size: 24px;
            text-align: center;
            margin: 20px 0;
        }
        h1, h2, h3 {
            text-align: center;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Join Us for Our Wedding!</h1>
        <div class="countdown" id="countdown"></div>
        <h2>The Couple</h2>
        <p>John Doe & Jane Smith</p>
        <h3>Date and Time</h3>
        <p>May 20, 2026 at 4:00 PM</p>
        <h3>Venue</h3>
        <p>Beautiful Garden, 123 Wedding St, City, Country</p>
    </div>

    <script>
        const countDownDate = new Date("May 20, 2026 16:00:00").getTime();
        const countdownElement = document.getElementById('countdown');

        const countdownFunction = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            countdownElement.innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

            if (distance < 0) {
                clearInterval(countdownFunction);
                countdownElement.innerHTML = "It's time!";
            }
        }, 1000);
    </script>

</body>
</html>
